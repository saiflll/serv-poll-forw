services:
  postgres:
    image: postgres:13
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      # Atur zona waktu di dalam kontainer postgres agar konsisten
      TZ: "Asia/Jakarta"
      PGTZ: "Asia/Jakarta"
    # Tidak perlu expose port database ke host jika hanya diakses oleh service lain
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - iot-net

  emqx:
    image: emqx:5.5
    container_name: emqx
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    environment:
      - EMQX_ALLOW_ANONYMOUS=false
      - EMQX_AUTH__USER__1__USERNAME=servfi_app
      - EMQX_AUTH__USER__1__PASSWORD=S3cr3tP@ssw0rd!
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      - iot-net

  backend:
    build:
      # Arahkan ke direktori backend Go Anda
      context: ./forward
      dockerfile: Dockerfile
    container_name: forwarder
    ports:
      - "8888:8888"
    environment:
      # Arahkan backend untuk terhubung ke service emqx dan postgres di dalam Docker
      - MQTT_BROKER_URI=tcp://emqx:1883
      - DB_HOST=postgres_db
      - TZ=Asia/Jakarta
    env_file:
      - .env
    depends_on:
      emqx:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - iot-net
      
  ota:
    container_name: ota-app
    build:
      context: ./ota
      dockerfile: Dockerfile
    ports:
      - "9999:9999"
    networks:
      - iot-net
    volumes:
      - ./ota/static/uploads:/app/static/uploads
    environment:
      - MQTT_BROKER=tcp://emqx:1883
      - MQTT_USER=cntrl
      - MQTT_PASS=
    restart: unless-stopped
    depends_on:
      - emqx
  # frontend:
  #   build:
  #     context: ./iot-suhu-fe
  #     args:
  #       - API_URL=http://172.20.100.11:8000/api
  #     dockerfile: DockerFile
  #   container_name: frontend
  #   ports:
  #     - "8080:80"

volumes:
  postgres_data:
  emqx_data:
  emqx_log:

networks:
  iot-net:
    driver: bridge